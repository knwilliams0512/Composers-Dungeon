name: Download site

# Publishes site/ to GitHub Pages: a download page whose links go through
# /releases/latest/download/, so it always serves the newest installer without
# ever needing regeneration.
#
# One-time setup in the repository: Settings → Pages → Source: GitHub Actions.
# (On a free plan, Pages requires the repository to be public.)

on:
  push:
    branches: ["**"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      # configure-pages reports a bare "Not Found" when the repository has no
      # Pages site, which reads like a broken workflow and is not one: it is a
      # setting nobody has switched on yet. Three runs failed that way before
      # anyone read the log, so the job now says what to do in its own summary.
      #
      # Note for anyone reaching for `enablement: true` on configure-pages: it
      # cannot work here. The action's own action.yml requires a token other
      # than the default GITHUB_TOKEN for that - a PAT with `repo`, or an app
      # with administration:write - so it would fail identically while looking
      # like the fix.
      - name: Explain why Pages failed
        if: failure()
        run: |
          {
            echo "### GitHub Pages is not switched on for this repository"
            echo
            echo "Nothing in the repository can turn it on. Do this once:"
            echo
            echo "1. **Settings -> Pages -> Build and deployment -> Source: GitHub Actions**"
            echo "2. Re-run this workflow."
            echo
            echo "On a free plan Pages also needs the repository to be **public**."
            echo "The Settings -> Pages screen says which of the two is stopping it."
          } >> "$GITHUB_STEP_SUMMARY"

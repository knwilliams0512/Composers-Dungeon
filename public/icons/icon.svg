<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#2d2547"/>
      <stop offset="55%" stop-color="#110e1c"/>
      <stop offset="100%" stop-color="#07060b"/>
    </radialGradient>
    <linearGradient id="gold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f0d894"/>
      <stop offset="52%" stop-color="#e3c26d"/>
      <stop offset="100%" stop-color="#a8863a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- arcane ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#4f63a8" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#gold)" stroke-opacity="0.55" stroke-width="6"/>

  <!-- portcullis / dungeon gate hint -->
  <g stroke="#c9a84c" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="118" x2="150" y2="394"/>
    <line x1="362" y1="118" x2="362" y2="394"/>
    <line x1="126" y1="150" x2="386" y2="150"/>
    <line x1="126" y1="362" x2="386" y2="362"/>
  </g>

  <!-- treble clef, scaled from the 24-unit glyph the app draws in its nav so
       the installer icon, the browser tab and the sidebar all carry one mark -->
  <g
    fill="none"
    stroke="url(#gold)"
    stroke-width="1.55"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
    transform="translate(256 256) scale(14.4) translate(-11.6 -12.5)"
  >
    <path d="M9.2 20.8C8.5 22.8 10.7 23.8 12.3 22.4 13.3 21.4 13 19.9 12.8 18.5 13.4 13.2 14.3 7.4 13.7 3.4 13.5 1.6 11.1 1.2 10.2 3.1 9 5.5 10.1 8 11.7 10 13.6 12.2 16.2 13.6 16.2 16.2 16.2 19.2 13.5 20.9 10.9 20.2 8.3 19.5 6.8 17.4 7.1 15.1 7.4 13 9.2 11.8 11 12.3 12.6 12.7 13.3 14 12.9 15.2"/>
  </g>
</svg>

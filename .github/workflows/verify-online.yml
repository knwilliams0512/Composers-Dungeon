name: Verify the online guild

# Proves a live hosted instance actually does the thing it was put online for:
# two different people, two separate browser sessions, one shared guild, and
# one seeing what the other wrote.
#
# Runs on a runner because this is the only place that can reach both the
# deployed site and the database — an agent environment's network policy
# answers 403 to CONNECT for *.vercel.app and api.neon.tech alike.
#
# Needs no Vercel token: just the public URL and the NEON_API_KEY that is
# already in this repository's secrets. So it works whether the app was
# deployed by the Deploy workflow or by Vercel's own GitHub integration.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "The live site, e.g. https://composers-dungeon.vercel.app"
        required: true
      neon_project_id:
        description: "Neon project ID"
        required: true
        default: "royal-boat-29341408"
      neon_branch:
        description: "Neon branch"
        required: true
        default: "production"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Find a browser
        id: browser
        run: |
          # ubuntu-latest ships Chrome; fall back rather than assume it.
          for c in /usr/bin/google-chrome /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$c" ]; then echo "path=$c" >> "$GITHUB_OUTPUT"; echo "using $c"; exit 0; fi
          done
          sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || true
          # Re-test rather than assume: chromium-browser is a transitional
          # package that can install to a different path or a snap, and the
          # failure would otherwise surface as a puppeteer spawn error three
          # steps later instead of as "no browser".
          for c in /usr/bin/chromium-browser /usr/bin/chromium /snap/bin/chromium; do
            if [ -x "$c" ]; then echo "path=$c" >> "$GITHUB_OUTPUT"; echo "using $c"; exit 0; fi
          done
          echo "No browser could be found or installed." >&2
          exit 1

      - name: Check the site responds at all
        env:
          # Through env, never interpolated into the script body: a dispatch
          # input containing a quote would otherwise close the quote and run
          # the remainder as commands on the runner.
          URL: ${{ inputs.url }}
        run: |
          # Fail here, legibly, rather than twelve lines deep in a browser
          # timeout. A wrong domain, a build that never finished, and a site
          # that is up but has no environment all look identical from inside
          # the test; they do not look identical here.
          CODE="$(curl -s -o body.txt -w '%{http_code}' --max-time 45 -L "$URL/login")" || CODE=000
          [ -n "$CODE" ] || CODE=000
          echo "GET $URL/login -> $CODE"
          case "$CODE" in
            200) echo "The site is up and serving." ;;
            000) echo "Nothing answered at that address. Check the URL is the live .vercel.app domain, not the vercel.com dashboard." >&2; exit 1 ;;
            404) echo "That address resolves but has no app on it. Wrong domain, or the deployment has not finished." >&2; exit 1 ;;
            500|502|503)
              echo "The app is deployed but erroring. That is almost always a missing environment variable:" >&2
              echo "DATABASE_URL, NEXTAUTH_SECRET, DATABASE_PROVIDER and CD_HOSTED all have to be set on the project." >&2
              head -c 600 body.txt >&2 || true
              exit 1 ;;
            *) echo "Unexpected status $CODE." >&2; exit 1 ;;
          esac

      - name: Read the database connection
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BRANCH: ${{ inputs.neon_branch }}
          NEON_PROJECT: ${{ inputs.neon_project_id }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "NEON_API_KEY is not in this repository's Actions secrets." >&2
            exit 1
          fi
          npm i -g neon@latest >/dev/null || {
            echo "Could not install the Neon CLI." >&2; exit 1; }
          DIRECT="$(neon connection-string "$NEON_BRANCH" --project-id "$NEON_PROJECT")"
          [ -n "$DIRECT" ] || { echo "Neon returned no connection string." >&2; exit 1; }
          echo "::add-mask::$DIRECT"
          echo "direct=$DIRECT" >> "$GITHUB_OUTPUT"

      - name: Run the two-player guild test
        env:
          DATABASE_URL: ${{ steps.db.outputs.direct }}
          DIRECT_DATABASE_URL: ${{ steps.db.outputs.direct }}
          # No DATABASE_PROVIDER here on purpose: the script talks to Prisma
          # directly and never loads src/lib/db-provider.ts, the only thing
          # that reads it. Setting it would imply a dependency that is not real.
          CHROME_PATH: ${{ steps.browser.outputs.path }}
          URL: ${{ inputs.url }}
        run: |
          # Without pipefail the pipeline reports tee's exit code, not the
          # test's, so a failing check goes green. It did exactly that on the
          # first run: four checks failed and the job reported success.
          set -o pipefail
          node scripts/make-postgres-schema.mjs
          npx prisma generate --schema prisma/schema.postgres.prisma >/dev/null
          node scripts/verify-online.mjs "$URL" | tee result.txt

      - name: Say what happened
        if: always()
        env:
          URL: ${{ inputs.url }}
        run: |
          {
            echo "### Online guild check — $URL"
            echo
            echo '```'
            cat result.txt 2>/dev/null || echo "(the test did not get far enough to report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

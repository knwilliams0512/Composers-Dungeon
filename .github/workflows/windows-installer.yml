name: Windows installer

# Builds ComposersDungeonSetup.exe on Linux (no Windows runner needed) and
# publishes it as a GitHub Release, so installing is "open Releases, download,
# double-click".
#
#   - push a tag like v1.1.0        -> builds and publishes that release
#   - run manually with a tag name  -> creates the tag and publishes it too
#   - run manually with no tag      -> builds only, downloadable as an artifact

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish (e.g. v1.1.0). Leave blank to build without releasing."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # osslsigncode signs Windows executables from Linux, so the installer can
      # still be built without a Windows runner. It is installed whether or not
      # a certificate is configured: a build that cannot sign should fail
      # loudly on a missing tool rather than silently ship unsigned.
      - name: Install NSIS and the signing tool
        run: sudo apt-get update && sudo apt-get install -y nsis osslsigncode

      - name: Install dependencies
        run: npm ci

      # The certificate is passed through the environment and never written to
      # the workspace. When the secrets are absent — a fork, or before one has
      # been bought — the build is identical to what it has always been and the
      # installer comes out unsigned.
      - name: Build the installer
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_TIMESTAMP: ${{ secrets.WINDOWS_CERT_TIMESTAMP }}
        run: bash scripts/windows/build-installer.sh

      - name: Say whether it was signed
        run: |
          if osslsigncode verify -in dist/ComposersDungeonSetup.exe 2>&1 | grep -qi "signature.*ok\|Succeeded"; then
            echo "::notice::The installer is signed."
          else
            echo "::warning::The installer is UNSIGNED - Windows SmartScreen will warn about it. See scripts/windows/sign.sh."
          fi

      - name: Show what was built
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ComposersDungeonSetup
          path: |
            dist/ComposersDungeonSetup.exe
            dist/ComposersDungeon-*-update.zip
            dist/latest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # A tag push and a manual run with a tag both end up here. `gh release
      # create` makes the tag itself when it doesn't exist yet, so a release can
      # be cut without pushing a tag first.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running a release refreshes both the assets and the notes, so
            # a fix to .github/release-notes.md reaches an already-published tag.
            gh release edit "$TAG" \
              --title "Composer's Dungeon ${TAG}" \
              --notes-file .github/release-notes.md
            gh release upload "$TAG" \
              dist/ComposersDungeonSetup.exe \
              dist/ComposersDungeon-*-update.zip \
              dist/latest.json \
              dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              --target "${GITHUB_SHA}" \
              --title "Composer's Dungeon ${TAG}" \
              --notes-file .github/release-notes.md \
              dist/ComposersDungeonSetup.exe \
              dist/ComposersDungeon-*-update.zip \
              dist/latest.json \
              dist/SHA256SUMS.txt
          fi
          echo "Released: $(gh release view "$TAG" --json url -q .url)"

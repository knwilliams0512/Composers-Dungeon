name: Deploy the online game

# Puts the app on Vercel and points it at the Neon database that the
# "Set up the Neon database" workflow already seeded.
#
# It runs here rather than from a development machine for the same reason that
# one does: a GitHub runner can reach api.vercel.com and api.neon.tech, which a
# restricted agent environment cannot.
#
# Needs one secret that is not here yet:
#
#   VERCEL_TOKEN   Vercel -> Account Settings -> Tokens -> Create
#                  (or VERCEL_TOKEN_ -- either name works, and whichever
#                  one Vercel actually accepts is the one that gets used)
#
# NEON_API_KEY is already present, from connecting the repository to Neon, and
# is what lets this read the connection strings rather than anyone copying a
# database password by hand.

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "The address you will sign up with (becomes CD_ADMIN_EMAIL)"
        required: true
      project_name:
        description: "Vercel project name"
        required: true
        default: "composers-dungeon"
      vercel_scope:
        description: >-
          The Vercel team/account slug the project lives under. It is the
          first path segment of the project's dashboard URL:
          vercel.com/<scope>/<project>. Without it the CLI looks in the
          personal account and either fails or creates a second, empty project.
        required: true
        default: "nexus-4be1"
      neon_project_id:
        description: "Neon project ID"
        required: true
        default: "royal-boat-29341408"
      neon_branch:
        description: "Neon branch"
        required: true
        default: "production"

permissions:
  contents: read

concurrency:
  group: deploy-online
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tokens are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_ALT: ${{ secrets.VERCEL_TOKEN_ }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          # GitHub refuses to create a secret whose name already exists, so a
          # replacement token often ends up stored beside the old one under a
          # near-miss name rather than over the top of it. Accept either, and
          # let the step below decide which of them actually authenticates.
          missing=""
          [ -z "$VERCEL_TOKEN" ] && [ -z "$VERCEL_TOKEN_ALT" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$NEON_API_KEY" ] && missing="$missing NEON_API_KEY"
          if [ -n "$missing" ]; then
            {
              echo "### Missing secrets:$missing"
              echo
              echo "Add them under **Settings → Secrets and variables → Actions**."
              echo "\`VERCEL_TOKEN\` comes from Vercel → Account Settings → Tokens."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Not set:$missing" >&2
            exit 1
          fi

      - run: npm i -g vercel@latest neon@latest

      - name: Check the Vercel token works
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_ALT: ${{ secrets.VERCEL_TOKEN_ }}
          SCOPE: ${{ inputs.vercel_scope }}
        run: |
          # Two questions, asked separately, because they have different fixes
          # and the CLI reports both as an unhelpful "User not found (404)"
          # from whichever command happens to run first.
          # A copied token very often arrives with a trailing newline or a
          # stray space, and Vercel rejects that as "not valid" with no hint
          # that the value is nearly right. Strip whitespace before using it.
          #
          # Both secret names are tried in turn and the first one Vercel
          # accepts is the one the rest of the job uses. Asking Vercel is the
          # only way to tell a live token from a revoked one: a revoked token
          # keeps its length and its vcp_ prefix, so it looks perfectly
          # well-formed right up to the point it is refused.
          WORKING=""
          WORKING_NAME=""
          LAST_ERROR="(no token was set)"
          N=0
          for CANDIDATE in "$VERCEL_TOKEN" "$VERCEL_TOKEN_ALT"; do
            N=$((N + 1))
            case $N in
              1) NAME="VERCEL_TOKEN" ;;
              *) NAME="VERCEL_TOKEN_" ;;
            esac

            CLEAN="$(printf '%s' "$CANDIDATE" | tr -d '[:space:]')"
            if [ -z "$CLEAN" ]; then
              echo "$NAME: not set, skipping"
              continue
            fi
            if [ "$CLEAN" != "$CANDIDATE" ]; then
              echo "note: $NAME had surrounding whitespace; using the trimmed value"
            fi
            echo "::add-mask::$CLEAN"

            # A fingerprint, not the token: its length and the scheme prefix
            # that every Vercel token shares publicly. Enough to tell an empty
            # secret from a truncated paste from a well-formed token, and not
            # enough to be worth anything to anyone reading the log.
            echo "$NAME: ${#CLEAN} characters, starts \"$(printf '%s' "$CLEAN" | cut -c1-4)\""
            case "$CLEAN" in
              vcp_*) ;;
              *) echo "  note: does not start with vcp_, which Vercel tokens normally do" ;;
            esac

            echo "  asking Vercel whether it is valid"
            if WHO="$(vercel whoami --token "$CLEAN" 2>&1)"; then
              echo "  accepted, belongs to: $WHO"
              WORKING="$CLEAN"
              WORKING_NAME="$NAME"
              break
            fi
            echo "  rejected: $WHO"
            LAST_ERROR="$WHO"
          done

          if [ -z "$WORKING" ]; then
            {
              echo "### No valid Vercel token"
              echo
              echo "Neither \`VERCEL_TOKEN\` nor \`VERCEL_TOKEN_\` was accepted."
              echo
              echo "Vercel said:"
              echo '```'
              echo "$LAST_ERROR"
              echo '```'
              echo
              echo "Usually one of:"
              echo "- the **revoked** token was pasted rather than the new one"
              echo "- the paste was truncated, or picked up a trailing space"
              echo "- the token has expired"
              echo
              echo "Make a fresh one at **vercel.com → avatar → Settings → Tokens**,"
              echo "scoped to **All Projects** under the team, then replace a secret"
              echo "and run this again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$LAST_ERROR" >&2
            exit 1
          fi

          echo "using the token stored as $WORKING_NAME"
          # Hand the chosen value to the rest of the job. Every later step
          # reads it from here and deliberately does not re-declare
          # VERCEL_TOKEN in its own env: a step-level env entry overrides
          # $GITHUB_ENV, which would quietly put the untrimmed, possibly
          # revoked secret back in place three steps further on.
          VERCEL_TOKEN="$WORKING"
          echo "VERCEL_TOKEN=$WORKING" >> "$GITHUB_ENV"

          # A warning, not a gate. A token scoped narrowly may be refused the
          # team listing while still being perfectly able to deploy, and a
          # check that is stricter than the thing it is checking for would
          # reject a token that works. The real answer comes from link and
          # deploy below; this only makes a later failure easier to read.
          echo "2. Which teams can it see? (informational)"  # SCOPE from env
          if vercel teams ls --token "$VERCEL_TOKEN" > teams.txt 2>&1; then
            cat teams.txt
            if grep -qF -- "$SCOPE" teams.txt; then
              echo "   '$SCOPE' is reachable"
            else
              {
                echo "### Warning: the team \`$SCOPE\` was not in this token's team list"
                echo
                echo '```'
                cat teams.txt
                echo '```'
                echo
                echo "If the deploy fails just below, this is why. A Vercel token is"
                echo "scoped to an **account or team**, never to a project — so if the"
                echo "scope picker offered \`composers-dungeon\`, that was the project"
                echo "and the token cannot do the team-level work a deploy needs."
                echo "Create one scoped to **Nexus** instead."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "   warning: '$SCOPE' not listed; continuing anyway"
            fi
          else
            echo "   could not list teams; continuing, since deploying may still work"
          fi

      - name: Read the Neon connection strings
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BRANCH: ${{ inputs.neon_branch }}
          NEON_PROJECT: ${{ inputs.neon_project_id }}
        run: |
          DIRECT="$(neon connection-string "$NEON_BRANCH" --project-id "$NEON_PROJECT")"
          POOLED="$(neon connection-string "$NEON_BRANCH" --project-id "$NEON_PROJECT" --pooled)"
          [ -n "$DIRECT" ] && [ -n "$POOLED" ] || { echo "Neon returned no connection string." >&2; exit 1; }
          echo "::add-mask::$DIRECT"
          echo "::add-mask::$POOLED"
          # Serverless functions must not hold a real Postgres connection open,
          # so the runtime url goes through the pooler and is capped at one
          # connection per function instance. DDL still needs the direct one.
          case "$POOLED" in
            *\?*) RUNTIME="${POOLED}&pgbouncer=true&connection_limit=1" ;;
            *)    RUNTIME="${POOLED}?pgbouncer=true&connection_limit=1" ;;
          esac
          echo "::add-mask::$RUNTIME"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "direct=$DIRECT" >> "$GITHUB_OUTPUT"

      - name: Create and link the Vercel project
        env:
          SCOPE: ${{ inputs.vercel_scope }}
          PROJECT: ${{ inputs.project_name }}
        run: |
          # Both are safe to repeat: the project may already exist from an
          # earlier run, and `link` only writes .vercel/project.json.
          vercel project add "$PROJECT" --scope "$SCOPE" --token "$VERCEL_TOKEN" 2>/dev/null || true
          vercel link --yes --project "$PROJECT" --scope "$SCOPE" --token "$VERCEL_TOKEN"

      - name: Set the environment
        env:
          RUNTIME_URL: ${{ steps.db.outputs.runtime }}
          DIRECT_URL: ${{ steps.db.outputs.direct }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          SCOPE: ${{ inputs.vercel_scope }}
        run: |
          # Generated here and never printed. It signs every session cookie, so
          # it should not pass through a chat log or an email on its way in.
          SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::$SECRET"

          # Does this project already have a session secret?
          #
          # It matters because set_env below removes before adding, so writing
          # a fresh secret on every deploy rotates the key that signs every
          # session cookie -- which signs out every player, mid-lesson, each
          # time anything is deployed. The first deploy must create one; every
          # later deploy must leave it exactly alone.
          HAVE_SECRET=no
          if vercel env ls production --scope "$SCOPE" --token "$VERCEL_TOKEN" > envs.txt 2>&1; then
            if grep -qE '(^|[[:space:]])NEXTAUTH_SECRET([[:space:]]|$)' envs.txt; then
              HAVE_SECRET=yes
            fi
          else
            # Could not tell. Keeping the existing secret is the safe guess: a
            # missing secret fails loudly on the next sign-in, while a rotated
            # one quietly logs everybody out.
            echo "note: could not list the environment; leaving any existing secret in place"
            HAVE_SECRET=yes
          fi

          set_env() {
            # Remove first so a re-run updates rather than erroring on a
            # duplicate, and so a rotated database password actually lands.
            vercel env rm "$1" production --yes --scope "$SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$2" | vercel env add "$1" production --scope "$SCOPE" --token "$VERCEL_TOKEN" >/dev/null
            echo "  set $1"
          }

          set_env DATABASE_URL        "$RUNTIME_URL"
          set_env DIRECT_DATABASE_URL "$DIRECT_URL"
          set_env DATABASE_PROVIDER   "postgresql"
          set_env CD_HOSTED           "1"
          if [ "$HAVE_SECRET" = "yes" ]; then
            echo "  kept NEXTAUTH_SECRET (rotating it would sign out every player)"
          else
            set_env NEXTAUTH_SECRET   "$SECRET"
          fi
          set_env CD_ADMIN_EMAIL      "$ADMIN_EMAIL"
          # NEXTAUTH_URL is deliberately not set. appBaseUrl() falls back to
          # VERCEL_PROJECT_PRODUCTION_URL, which is the stable production
          # domain and is known to the running app without anyone having to
          # learn the URL before the first deploy has produced it.

      - name: Deploy
        id: deploy
        env:
          SCOPE: ${{ inputs.vercel_scope }}
        run: |
          # Without pipefail the pipeline reports tail's exit code, so a failed
          # deploy goes green with a fragment of an error message as the URL,
          # and the check below then blames the app for not serving.
          # The CLI puts the deployment URL on stdout and EVERYTHING else on
          # stderr -- progress, the "Aliased" line, the next-steps block. The
          # previous attempt teed stdout and then looked for "Aliased" in it,
          # which could never match: stdout held one line, the URL, without
          # even a trailing newline. So the two streams are captured
          # separately, and stderr is echoed back so the log still reads the
          # same.
          if ! vercel deploy --prod --yes --scope "$SCOPE" --token "$VERCEL_TOKEN" \
               > deploy.out 2> deploy.err; then
            cat deploy.err >&2
            echo "vercel deploy failed" >&2
            exit 1
          fi
          cat deploy.err

          URL="$(tail -1 deploy.out)"
          case "$URL" in
            https://*) ;;
            *) echo "vercel did not return a deployment URL (got: $URL)" >&2; exit 1 ;;
          esac

          # The production alias, from stderr where it is actually printed.
          # Escape codes come off first: that line is coloured.
          ALIAS="$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' deploy.err \
            | sed -n 's/.*Aliased[[:space:]]*\(https:\/\/[^[:space:]]*\).*/\1/p' \
            | head -1)"

          echo "deployment: $URL"
          echo "alias:      ${ALIAS:-(none printed)}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"

      - name: Check it is actually serving
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ steps.deploy.outputs.alias }}
          PROJECT: ${{ inputs.project_name }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: |
          # A green deploy is not the same as a working app: a bad DATABASE_URL
          # surfaces only when a page tries to query. /login renders and the
          # middleware runs, so a 200 means the build, the env and the database
          # are all good.
          #
          # Asked as "is there an address that serves?" rather than "does this
          # one address serve?", because the project has several and they are
          # protected independently. The per-deployment URL stays behind
          # Vercel's SSO even when the alias is public -- that is the correct
          # configuration for a game anyone can play -- so checking it alone
          # failed twice on deploys that were serving players perfectly well.
          CANDIDATES="$ALIAS https://$PROJECT.vercel.app $URL"
          SERVING=""
          TRIED=""
          for CANDIDATE in $CANDIDATES; do
            [ -n "$CANDIDATE" ] || continue
            case " $TRIED " in *" $CANDIDATE "*) continue ;; esac
            TRIED="$TRIED $CANDIDATE"

            echo "trying $CANDIDATE"
            for i in 1 2 3 4; do
              CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$CANDIDATE/login")" || CODE=000
              [ -n "$CODE" ] || CODE=000
              # Where a redirect points is the whole diagnosis: to vercel.com is
              # deployment protection, anywhere else is the app's own doing.
              WHERE="$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 30 "$CANDIDATE/login" 2>/dev/null)" || WHERE=""
              echo "  attempt $i: /login -> $CODE${WHERE:+  (redirects to $WHERE)}"
              if [ "$CODE" = "200" ]; then SERVING="$CANDIDATE"; break; fi
              # A protected address will never answer 200, so stop asking it.
              case "$WHERE" in *vercel.com/sso*) echo "  (behind Vercel's SSO; moving on)"; break ;; esac
              sleep 10
            done
            [ -n "$SERVING" ] && break
          done

          if [ -z "$SERVING" ]; then
            echo "No address served /login." >&2
            {
              echo "### The game is not reachable"
              echo
              echo "None of these served \`/login\`:"
              for c in $TRIED; do echo "- \`$c\`"; done
              echo
              echo "If they all redirect to vercel.com, deployment protection is on"
              echo "for the production alias too. Set **Vercel → the project →**"
              echo "**Settings → Deployment Protection → Vercel Authentication** to"
              echo "*Only Preview Deployments*."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "serving: $SERVING"
          {
            echo "### The online game is live"
            echo
            echo "**$SERVING**"
            echo
            echo "Sign up with \`$ADMIN_EMAIL\` — that is the only"
            echo "account allowed to configure the mail sender."
          } >> "$GITHUB_STEP_SUMMARY"
